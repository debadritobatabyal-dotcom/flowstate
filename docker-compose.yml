version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: flowstate_db
    environment:
      POSTGRES_USER: flowstate
      POSTGRES_PASSWORD: flowstate
      POSTGRES_DB: flowstate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowstate_backend
    environment:
      - DATABASE_URL=postgresql+psycopg://flowstate:flowstate@db:5432/flowstate
      - FRONTEND_ORIGIN=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
      - UPLOAD_DIR=/app/storage/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowstate_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
